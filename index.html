<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Blog preview card</title>

    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <div class="cards-container">
      <div class="card">
        <img
          src="./assets/images/illustration-article.svg"
          alt=""
          class="card-img"
        />
        <div class="card-content">
          <button class="btn">Learning</button>
          <p class="card-date">Published 21 Dec 2025</p>
          <h1 class="card-title">HTML & CSS foundations</h1>
          <p class="card-text">
            These languages are the backbone of every website, defining
            structure, content, and presentation.
          </p>
        </div>
        <div class="card-footer">
          <img src="./assets/images/image-avatar.webp" alt="" class="avatar" />
          <h2 class="avatar-name">Greg Hooper</h2>
        </div>
      </div>
    </div>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by
      <a href="https://www.frontendmentor.io/profile/andrii-rykal"
        >Andrii Rykal</a
      >.
    </footer>
  </body>
</html>
